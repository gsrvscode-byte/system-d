# docker-compose.yml
# -----------------------------------------------------------------------------
# Full stack:
#   nginx         -> public entrypoint (port 80), load-balances across all
#                    running "app" replicas (see docker/nginx/nginx.conf)
#   app           -> Express API (no fixed container_name / no published
#                    host port on purpose — scale this with `--scale app=N`)
#   email-worker  -> separate process consuming the RabbitMQ email queue,
#                    scales independently of the API
#   mongo         -> primary datastore
#   rabbitmq      -> email job queue (management UI on :15672)
#   mailhog       -> local SMTP catcher for dev (UI on :8025) — swap SMTP_*
#                    env vars for a real provider in production, nothing
#                    else changes
#
# SCALING THE APP:
#   docker compose up --build --scale app=3 -d
# Nginx picks up the new replicas automatically (see nginx.conf comments) —
# no nginx reload, no manual upstream list to maintain.
# -----------------------------------------------------------------------------

version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads-data:/usr/src/app/uploads:ro
    depends_on:
      - app
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # No container_name: fixed names collide when scaled to multiple
    # replicas, and Docker refuses to start a second one.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/task_management
      RABBITMQ_URL: amqp://rabbitmq:5672
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads-data:/usr/src/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    # Not published to the host on purpose — only nginx is public. Each
    # replica still listens on 5000 *inside* the network, which is all
    # nginx's dynamic resolver needs (see nginx.conf).
    expose:
      - "5000"

  email-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email_worker
    restart: unless-stopped
    command: ["node", "workers/email.worker.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://rabbitmq:5672
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - app-network

  mongo:
    image: mongo:7
    container_name: mongo_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (guest/guest by default)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI — view every email the worker "sends"
    networks:
      - app-network

volumes:
  mongo-data:
  rabbitmq-data:
  redis-data:
  uploads-data:

networks:
  app-network:
    driver: bridge
