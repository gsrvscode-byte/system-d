# docker/nginx/nginx.conf
# -----------------------------------------------------------------------------
# Reverse proxy + load balancer in front of the "app" service.
#
# WHY THIS ISN'T A STATIC "upstream { server app:5000; }" BLOCK:
# A normal nginx `upstream` block resolves the hostname ONCE, at nginx
# startup, and caches whichever single IP it got back. That works fine for
# one container, but it means nginx would keep sending 100% of traffic to
# just one of the app replicas even after you scale up with:
#
#   docker compose up --scale app=3 -d
#
# Instead, this uses Docker's embedded DNS server (127.0.0.11) with a
# `resolver` directive and puts the upstream host in a variable used in
# proxy_pass. That combination forces nginx to re-resolve "app" on every
# request (respecting the `valid=10s` TTL below) instead of caching one IP
# forever — so newly added/removed replicas are picked up automatically,
# and Docker's DNS round-robins across all of them, giving load balancing
# "for free" without nginx needing to track replica IPs itself.
# -----------------------------------------------------------------------------

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;

    client_max_body_size 15m;   # a bit above MAX_FILE_SIZE (10MB default) for multipart overhead

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location / {
        set $upstream_app app:5000;
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Uploaded files, served straight from the shared volume rather than
    # proxied through Node — cheaper for nginx to serve static files itself.
    location /uploads/ {
        alias /usr/src/app/uploads/;
        access_log off;
        expires 7d;
    }

    location /health {
        set $upstream_app app:5000;
        proxy_pass http://$upstream_app/health;
        access_log off;
    }
}
